name: Build Project

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: [self-hosted]
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - WebGL
          # - StandaloneWindows64
          # - StandaloneOSX
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build
        run: |
          # 1. Create license file from secret
          echo "${{ secrets.UNITY_LICENSE }}" > ./Unity_v6000.x.ulf

          # 2. Run Unity Build in Docker
          # Using the image that successfully pulled earlier
          IMAGE="unityci/editor:ubuntu-6000.3.5f1-webgl-3"

          # Ensure build directory exists and has permissions
          mkdir -p build/WebGL
          chmod -R 777 build

          sudo docker run --rm \
            -v "$(pwd):/project" \
            -v "$(pwd)/Unity_v6000.x.ulf:/project/Unity_v6000.x.ulf" \
            -w /project \
            -e UNITY_LICENSE_FILE=/project/Unity_v6000.x.ulf \
            $IMAGE \
            unity-editor \
            -batchmode \
            -nographics \
            -quit \
            -manualLicenseFile /project/Unity_v6000.x.ulf \
            -projectPath . \
            -executeMethod Builder.BuildWebGL \
            -logFile /dev/stdout

      - name: Fix Permissions
        if: always()
        run: sudo chown -R $USER:$USER build

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
