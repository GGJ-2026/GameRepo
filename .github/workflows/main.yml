name: Build Project (Avalin-Style)

on:
    workflow_dispatch:
        inputs:
            targetPlatform:
                description: "Build Target"
                required: true
                default: "WebGL"
                type: choice
                options:
                    - WebGL
                    - StandaloneWindows64
                    - StandaloneOSX
    pull_request:
        types: [opened, synchronize]

permissions:
    checks: write
    contents: read
    pull-requests: write

jobs:
    build:
        name: Build ${{ inputs.targetPlatform || 'WebGL' }}
        runs-on: [self-hosted]

        # Avalin Logic: Define matrix or single target
        strategy:
            fail-fast: false
            matrix:
                # If triggered via PR, build WebGL. If manual, build input.
                targetPlatform:
                    - ${{ inputs.targetPlatform || 'WebGL' }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Cache
              uses: actions/cache@v3
              with:
                  path: Library
                  key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
                  restore-keys: |
                      Library-${{ matrix.targetPlatform }}-
                      Library-

            # Avalin Logic: Use direct secret envs and game-ci
            - name: Build project
              uses: game-ci/unity-builder@v4
              env:
                  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
                  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
                  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
              with:
                  targetPlatform: ${{ matrix.targetPlatform }}
                  allowDirtyBuild: true

            # Avalin Logic: Linux permissions fix
            - name: Fix Permissions
              if: always()
              env:
                  RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
              run: echo "$RUNNER_SUDO_PASSWORD" | sudo -S chown -R $USER:$USER build Library

            - uses: actions/upload-artifact@v4
              with:
                  name: Build-${{ matrix.targetPlatform }}
                  path: build/${{ matrix.targetPlatform }}
