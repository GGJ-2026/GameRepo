name: Build Project (Avalin-Style)

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: "Build Target"
        required: true
        default: "WebGL"
        type: choice
        options:
          - WebGL
          - StandaloneWindows64
          - StandaloneOSX
  push:
    branches: ["main"]
#  pull_request:
#    types: [opened, synchronize]

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build ${{ inputs.targetPlatform || 'WebGL' }}
    runs-on: [self-hosted]
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - ${{ inputs.targetPlatform || 'WebGL' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
          runAsHostUser: true
          chownFilesTo: "1000:1000"

      - name: Fix Permissions
        if: always()
        env:
          RUNNER_SUDO_PASSWORD: ${{ secrets.RUNNER_SUDO_PASSWORD }}
        run: echo "$RUNNER_SUDO_PASSWORD" | sudo -S chown -R $USER:$USER build Library

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  deploy:
    needs: build
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (inputs.targetPlatform == 'WebGL' || inputs.targetPlatform == '' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: build

      - name: Flatten Directory
        run: |
          if [ -d "build/WebGL" ]; then
            echo "Detected WebGL subdirectory. Flattening..."
            mv build/WebGL/* build/
            rm -rf build/WebGL
          fi
          ls -R build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
